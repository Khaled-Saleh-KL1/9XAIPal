name: CI

# Runs on every PR into dev or main (the merge gate for both) and on pushes
# to either (a post-merge sanity check). dev is where feature branches land
# day to day; main only ever moves via a dev -> main PR, once dev has been
# tested locally — this is what makes deploy.yml (gated on a CI success
# specifically on main, see its own header) a genuine second check, not a
# rerun of the same one. Each job is path-gated (see the `changes` job), so a
# PR only runs the checks for the area it touches — a docs- or frontend-only
# PR won't wait on the backend suite.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# A newer commit on the same PR/branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detect which areas a PR touches so we only run the jobs that matter.
  # IMPORTANT: a job skipped by the `if:` below still reports "success" to
  # branch protection, so required checks stay satisfied and merges are never
  # blocked. (Filtering at the workflow `on:` level would instead leave checks
  # "pending" and block merges — hence per-job gating here.)
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Mirrors the production build (package.json build = "tsc && vite build"),
      # so a green check here means it will succeed.
      - name: Type-check and build
        run: npm run build

  backend:
    name: backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real Postgres with pgvector — the tests apply migrations (schema.sql
    # creates the vector + uuid-ossp extensions) and exercise pgvector queries.
    # Real Redis — session storage + the auth rate limiter (app/core/auth.py,
    # app/api/deps.py) need an actual server, not a mock.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: 9xaipal
          POSTGRES_PASSWORD: 9xaipal_dev_password
          POSTGRES_DB: 9xaipal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U 9xaipal -d 9xaipal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: 9xaipal
      POSTGRES_PASSWORD: 9xaipal_dev_password
      POSTGRES_DB: 9xaipal_test
      REDIS_URL: redis://localhost:6379/0
      # Session cookies are Secure by default (settings.debug controls this —
      # see app/api/v1/endpoints/auth.py); the test client talks plain HTTP,
      # and a browser-correct cookie jar withholds a Secure cookie from a
      # non-HTTPS request, so auth tests need this the same way a local
      # non-TLS dev server would.
      DEBUG: "true"
      # One test resolves an embedding provider (the actual HTTP call is mocked);
      # pin to Ollama so resolution succeeds offline with no API key or network.
      EMBEDDING_PROVIDER: ollama
      # test_chunk_sequence inserts raw 4096-dim mock vectors, so the migrated
      # chunk_embeddings.embedding column must be vector(4096). The oversized
      # HNSW index (>2000 dims) is skipped best-effort; the test doesn't use it.
      VECTOR_DIMENSION: "4096"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lite.txt

      # requirements.lite.txt is requirements.txt minus `mineru[core]` — the
      # only difference. mineru_client.py never imports the mineru PyPI
      # package (it shells out to the CLI), so nothing under test needs it,
      # and `pip install -r requirements.txt` here was silently pulling in
      # the full default CUDA torch wheel (~530MB) plus the entire NVIDIA
      # CUDA toolkit dependency chain — never used, and a real source of CI
      # slowness/flakiness. Verified: the full suite passes identically
      # against this lighter set.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lite.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        # `python -m pytest` puts the backend/ working dir on sys.path so the
        # `app` package imports without an editable install of the heavy
        # (torch/MinerU) pyproject dependencies.
        run: python -m pytest -q
