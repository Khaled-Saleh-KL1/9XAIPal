name: Deploy

# Runs on the self-hosted runner living on the production box itself — but
# only once the CI workflow has actually finished successfully on main, not
# on the raw push itself. Those used to be two independent workflows
# triggered by the same `push: main` event with no ordering between them: a
# push that failed CI would still deploy, and (since branch protection here
# has `enforce_admins: false`) a direct push bypassing a PR entirely would
# deploy with zero verification. workflow_run closes both: this only fires
# after CI's own run for that exact commit reports success, regardless of
# how the commit reached main.
#
# There is exactly one deploy target, so runs queue instead of overlapping
# (cancel-in-progress: false — never kill a deploy that's already rebuilding
# containers mid-flight).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  # Lets this workflow create/update a GitHub Deployment automatically (via
  # the job-level `environment:` key below) — needed for the deployment
  # status GitHub shows on the repo homepage, on commits, and on PRs.
  deployments: write

env:
  # The persistent deployment directory. This is NOT where actions/checkout
  # runs — it deletes and recreates its target directory on every single
  # run, unconditionally (`clean: false` only skips an *additional* git-clean
  # on top of that, it doesn't prevent it). Anything untracked living inside
  # a checkout-managed directory — backend/.env (secrets), backend/app/
  # storage/* (uploaded papers), backend/frontend-dist (the built SPA),
  # .last-good-sha (this workflow's own rollback marker, see below) — WILL be
  # destroyed sooner or later if checkout and the live deployment share a
  # directory. So they don't: checkout gets its own disposable workspace, and
  # this directory receives only a one-way sync of the tracked files.
  DEPLOY_DIR: /home/kl1/apps/9xaipal

jobs:
  deploy:
    name: deploy
    runs-on: self-hosted
    # workflow_run fires on every CI completion regardless of outcome — the
    # `branches:` filter above already narrows this to CI runs on main, but
    # says nothing about whether CI actually passed. Both checks matter:
    # conclusion catches a failed/cancelled CI run, event catches the
    # (should be impossible, but cheap to rule out explicitly) case of some
    # other trigger producing a run whose head_branch happens to read "main".
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    # Turns this job into a tracked GitHub Deployment: shows "in progress"
    # the moment it starts, then success/failure when it finishes, on the
    # repo homepage's Environments widget, on this commit, and on the PR
    # that introduced it. GitHub creates and updates this automatically —
    # no extra step or third-party action needed, just this key.
    environment:
      name: production
      url: https://9xaipal.kl1.site
    steps:
      # ref: pins this checkout to the EXACT commit CI just validated — the
      # default for a workflow_run-triggered job is the default branch's
      # CURRENT tip, which is only guaranteed to match if no other push
      # landed in the (usually short, but not zero) gap between CI finishing
      # and this job starting. Every other `github.sha` in this file below
      # would have the same problem, so this workflow uses
      # `github.event.workflow_run.head_sha` throughout instead.
      #
      # fetch-depth: 0 (full history, not just this commit) is what makes
      # the rollback step below possible — it needs to `git worktree add` an
      # EARLIER commit than this one, which a shallow clone wouldn't have.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # Decided BEFORE the sync overwrites anything: the diff is between the
      # commit that is running (.last-good-sha, recorded by the last deploy
      # that passed its health check) and the one CI just validated. A
      # README merge comes out `none`; a frontend-only change never
      # restarts a container. See scripts/deploy-scope.sh for the rules —
      # they mirror ci.yml's "detect changes" filters on purpose.
      - name: Decide what this deploy has to rebuild
        id: scope
        run: |
          DEPLOYED=$(cat "$DEPLOY_DIR/.last-good-sha" 2>/dev/null || true)
          SCOPE=$(bash scripts/deploy-scope.sh "$DEPLOYED" "${{ github.event.workflow_run.head_sha }}")
          echo "Running: ${DEPLOYED:-<none>} → new: ${{ github.event.workflow_run.head_sha }} → scope: $SCOPE"
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          # The host's nginx config is installed by hand (sudo) — nothing
          # here can apply a change to it, so say so where it will be seen.
          if [ -n "$DEPLOYED" ] && ! git diff --quiet "$DEPLOYED" "${{ github.event.workflow_run.head_sha }}" -- backend/nginx; then
            echo "::notice::backend/nginx/ changed in this deploy. The host's /etc/nginx/sites-enabled/9xaipal.conf is installed by hand and was NOT updated — diff it against backend/nginx/9xaipal.conf and reload nginx with sudo."
          fi

      # frontend/node_modules is untracked (so absent from the checkout) and
      # would be deleted by --delete on every run, forcing a full `npm ci`
      # each time; excluded so deploy-once.sh can skip the install when the
      # lockfile is unchanged.
      - name: Sync tracked files into the deployment directory
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='backend/.env' \
            --exclude='backend/app/storage/' \
            --exclude='backend/frontend-dist/' \
            --exclude='frontend/node_modules/' \
            --exclude='.last-good-sha' \
            ./ "$DEPLOY_DIR"/

      # Everything a deploy attempt actually does — build the frontend,
      # build+restart the containers, poll the health check — lives in one
      # script (scripts/deploy-once.sh) so the rollback path below can call
      # the EXACT same sequence instead of a second, hand-maintained copy of
      # it drifting out of sync in this file.
      - name: Deploy
        id: deploy
        env:
          DEPLOY_SCOPE: ${{ steps.scope.outputs.scope }}
        run: bash "$DEPLOY_DIR/scripts/deploy-once.sh"

      # Only reached if the step above actually succeeded — this commit is
      # now the one to fall back to if some FUTURE deploy breaks. Excluded
      # from the rsync above, so it survives every future sync untouched.
      - name: Record this commit as the last known-good deploy
        if: success()
        run: echo "${{ github.event.workflow_run.head_sha }}" > "$DEPLOY_DIR/.last-good-sha"

      # The deploy above passed CI, built cleanly, and still failed its own
      # health check at runtime — the OLD, working containers are already
      # gone by this point (docker compose up already replaced them), so
      # without this the site would simply stay down until a human notices
      # and pushes a fix. Instead: restore $DEPLOY_DIR to the last commit
      # that DID pass its health check, and run the exact same deploy
      # sequence against it. The job still reports failure either way (a
      # step above already failed, and nothing here changes that) — this
      # only decides whether the SITE is down while that gets investigated.
      - name: Automatic rollback to the last known-good commit
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          if [ ! -f "$DEPLOY_DIR/.last-good-sha" ]; then
            echo "::error::Deploy of ${{ github.event.workflow_run.head_sha }} failed and there is no previous known-good deploy recorded — nothing to roll back to. This is likely the first deploy under this workflow; manual intervention is required."
            exit 0
          fi
          GOOD_SHA=$(cat "$DEPLOY_DIR/.last-good-sha")
          echo "::warning::Deploy of ${{ github.event.workflow_run.head_sha }} failed its health check. Rolling back to last known-good commit $GOOD_SHA."

          git worktree add /tmp/rollback-src "$GOOD_SHA"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='backend/.env' \
            --exclude='backend/app/storage/' \
            --exclude='backend/frontend-dist/' \
            --exclude='frontend/node_modules/' \
            --exclude='.last-good-sha' \
            /tmp/rollback-src/ "$DEPLOY_DIR"/
          git worktree remove /tmp/rollback-src --force

          # Always a full deploy: the failed attempt may have rebuilt any
          # subset of the stack, so the restored tree has to be rebuilt in
          # every area to be known-good again.
          if DEPLOY_SCOPE=full bash "$DEPLOY_DIR/scripts/deploy-once.sh"; then
            echo "::notice::Rollback to $GOOD_SHA restored service. ${{ github.event.workflow_run.head_sha }} is still broken and needs a fix — the site is running the last good version in the meantime."
          else
            echo "::error::Rollback to $GOOD_SHA ALSO failed its health check. The box needs manual attention now — this is no longer just a bad commit."
            exit 1
          fi

      # ⚠ The prune here decides whether the NEXT backend deploy takes ~1
      # minute or ~5. deploy-once.sh builds with `compose up -d --build`,
      # and a build is fast only when BuildKit finds its previous step
      # results (the apt-get layer, the `uv sync` layer, the MinerU model
      # download) in the build cache: an `app/`-only change then rebuilds
      # one small COPY layer and exports that alone. Measured 2026-09-12 on
      # this box: fully cached, an api rebuild is 0.6 s; with the cache
      # gone it is apt-get 20 s + uv sync 30 s + models 24 s + 130–175 s of
      # "exporting layers" for the 9 GB worker image — the full five
      # minutes, on every backend merge, whatever changed.
      #
      # `docker builder prune -f` — what this step ran until today — is
      # exactly what threw that cache away. Without `--all` it is documented
      # as removing only "dangling" cache, and the earlier comment here
      # assumed the just-built images' layers were therefore safe. They are
      # not: under the containerd image store this daemon uses, the image's
      # layers live in containerd and BuildKit's own step records are
      # referenced by nothing once the build ends, so plain `-f` reclaims
      # them (2.5–3.5 GB after every backend build — verified: prune, then
      # rebuild the unchanged api image → 0 of 6 steps CACHED, 54 s; skip
      # the prune → 6 of 6 CACHED, 0.6 s). Every backend deploy since the
      # step was added has been a cold rebuild for this reason.
      #
      # So: prune only what has not been USED for a week (`until=168h`,
      # measured against last use, so a step reused by today's build is
      # kept), and never the `exec.cachemount` records — that is uv's
      # download cache (backend/Dockerfile's --mount=type=cache), the torch
      # and MinerU wheels. Growth is bounded because unchanged steps are
      # reused rather than duplicated: a new 2.7 GB `uv sync` record appears
      # only when the lockfile changes, and the old one ages out in a week.
      # (Verified: `prune -f --filter until=1h --filter type!=exec.cachemount`
      # right after a build removes 0 B and the next build is still fully
      # cached.)
      #
      # ⚠ `docker image prune` deliberately stays WITHOUT `-a`: `-a`
      # removes every image not backing a *running* container, and
      # deploy-once.sh's frontend build is a transient `docker run --rm
      # node:20-alpine` that holds no container between deploys. `-a` would
      # therefore delete node:20-alpine (and the pinned uv image, and
      # pgvector) right after every deploy used it, forcing a re-pull on the
      # next one. Measured: that is what happened when a manual `-a` prune
      # was run on this box on 2026-09-10 (and again on 2026-09-12).
      #
      # ⚠⚠ Volumes and containers ARE pruned, but ONLY this compose project's
      # own — note the label filter. `docker prune` is daemon-wide, and this
      # box is NOT single-tenant: it also runs an unrelated `lcms` stack
      # (its own Postgres + Redis, holding its own data) started with plain
      # `docker run`, so those containers carry NO compose project label at
      # all. Unfiltered, this step would mean a 9xaipal deploy could delete
      # a deliberately-STOPPED lcms container, or lcms-redis's anonymous
      # data volume if that container were ever removed. A deploy workflow
      # has no business reaching into another project on the same host, so
      # it doesn't: `com.docker.compose.project=backend` is on every volume
      # and container this stack creates (verified) and on nothing lcms owns.
      #
      # Consequence worth knowing: anonymous volumes left behind by ad-hoc
      # `docker run` work (throwaway test databases from a dev session, for
      # example — pgvector declares VOLUME /var/lib/postgresql/data, so each
      # discarded test container orphans ~100MB) are deliberately NOT cleaned
      # here. They are indistinguishable from lcms's own anonymous volume,
      # which is exactly why this stays scoped. That is manual cleanup, and a
      # dev session's mess is its own to clear up.
      #
      # Named volumes were never at risk either way: on Docker 29.x
      # `volume prune` without `--all` only removes ANONYMOUS volumes, so
      # backend_9xaipal_postgres_data and lcms-db-data are both immune even
      # while temporarily detached mid-recreate (verified empirically).
      #
      # ⚠ One thing this step cannot fix: the daemon's own builder GC policy
      # caps `exec.cachemount` + `source.local` records at ~1.3 GiB by
      # default (`docker buildx inspect default`, rule #0), and the worker's
      # uv cache is ~1.7 GB, so BuildKit evicts it on its own shortly after
      # every worker build regardless of what is pruned here. Raising that
      # cap is a /etc/docker/daemon.json change (root) — see
      # backend/DEPLOYMENT-PRODUCTION.md §9.
      - name: Reclaim disk space (old image layers, week-old build cache, dead volumes)
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f --filter until=168h --filter 'type!=exec.cachemount'
          docker container prune -f --filter label=com.docker.compose.project=backend
          docker volume prune -f --filter label=com.docker.compose.project=backend
          docker system df
