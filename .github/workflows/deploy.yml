name: Deploy

# Runs on the self-hosted runner living on the production box itself, after
# every push to main. There is exactly one deploy target, so pushes queue
# instead of overlapping (cancel-in-progress: false — never kill a deploy
# that's already rebuilding containers mid-flight).
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  # Lets this workflow create/update a GitHub Deployment automatically (via
  # the job-level `environment:` key below) — needed for the deployment
  # status GitHub shows on the repo homepage, on commits, and on PRs.
  deployments: write

env:
  # The persistent deployment directory. This is NOT where actions/checkout
  # runs — it deletes and recreates its target directory on every single
  # run, unconditionally (`clean: false` only skips an *additional* git-clean
  # on top of that, it doesn't prevent it). Anything untracked living inside
  # a checkout-managed directory — backend/.env (secrets), backend/app/
  # storage/* (uploaded papers), backend/frontend-dist (the built SPA) — WILL
  # be destroyed sooner or later if checkout and the live deployment share a
  # directory. So they don't: checkout gets its own disposable workspace, and
  # this directory receives only a one-way sync of the tracked files.
  DEPLOY_DIR: /home/kl1/apps/9xaipal

jobs:
  deploy:
    name: deploy
    runs-on: self-hosted
    # Turns this job into a tracked GitHub Deployment: shows "in progress"
    # the moment it starts, then success/failure when it finishes, on the
    # repo homepage's Environments widget, on this commit, and on the PR
    # that introduced it. GitHub creates and updates this automatically —
    # no extra step or third-party action needed, just this key.
    environment:
      name: production
      url: https://kl1-9xaipal.duckdns.org
    steps:
      - uses: actions/checkout@v4

      - name: Sync tracked files into the deployment directory
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='backend/.env' \
            --exclude='backend/app/storage/' \
            --exclude='backend/frontend-dist/' \
            ./ "$DEPLOY_DIR"/

      - name: Build frontend
        working-directory: ${{ env.DEPLOY_DIR }}/backend
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$(pwd)/../frontend:/src" \
            -v "$(pwd)/frontend-dist:/dist" \
            -w /src \
            node:20-alpine \
            sh -c "npm ci --prefer-offline --no-audit --progress=false && \
                   VITE_API_BASE_URL=https://kl1-9xaipal.duckdns.org npm run build && \
                   rm -rf /dist/* && cp -r dist/* /dist/"

      - name: Build and restart containers
        working-directory: ${{ env.DEPLOY_DIR }}/backend
        run: docker compose -f docker-compose.prod.yml -f docker-compose.selfhost.yml up -d --build

      - name: Wait for health check
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null; then
              echo "Healthy after ${i} attempt(s)."
              exit 0
            fi
            sleep 3
          done
          echo "::error::API did not become healthy within 60s of deploy."
          docker compose -f "$DEPLOY_DIR/backend/docker-compose.prod.yml" -f "$DEPLOY_DIR/backend/docker-compose.selfhost.yml" logs --tail=100 api
          exit 1

      - name: Reclaim disk space from old image layers
        if: always()
        run: docker image prune -f
