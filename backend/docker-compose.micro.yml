# Overlay for a small/RAM-constrained VM. Use ONLY together with the base
# file:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.micro.yml up -d --build
#
# The base file targets a comfortably-sized box. This trims the same stack to
# fit in under a gigabyte — apply it only if the production server is
# actually this tight on RAM; drop it otherwise.
#
# Budget (roughly, idle): postgres ~150 MB, api ~200 MB, celery ~200 MB,
# searxng ~180 MB, redis ~20 MB, OS ~200 MB. That can exceed RAM on a small
# box, so it MUST have swap. Chat/vision run on Ollama Cloud, so the box
# mostly waits on network for those; embeddings run on the host's own Ollama
# install (see docker-compose.prod.yml), which is NOT part of this overlay.

services:
  postgres:
    # Defaults assume far more RAM. shared_buffers is the big one; the rest
    # keeps per-connection allocations small.
    command: >
      postgres
       -c shared_buffers=96MB
       -c max_connections=30
       -c work_mem=2MB
       -c maintenance_work_mem=32MB
       -c effective_cache_size=256MB
       -c max_worker_processes=2
       -c max_parallel_workers=1
       -c max_parallel_workers_per_gather=0

  redis:
    # Cap Redis so a backlog can never consume the box; it is only a Celery
    # broker here, not a data store.
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru

  api:
    # One worker, not two — each uvicorn worker is a full Python process with
    # its own SQLAlchemy pool.
    command: >
      uvicorn app.main:app
       --host 0.0.0.0 --port 8000
       --workers 1
       --log-level info
    environment:
      DB_POOL_SIZE: 3
      DB_MAX_OVERFLOW: 2

  celery_worker:
    environment:
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 2
      # Rasterising PDF pages is the one genuinely local, memory-hungry step,
      # so keep VLM calls serial. DPI stays HIGH deliberately: measured against
      # the real Table 3 of "Attention Is All You Need" on 2026-08-18, 150 and
      # 220 DPI both placed the (B) row values under the wrong column, while
      # 300 DPI read them correctly. Extraction quality is worth the extra
      # megabytes and the slower page — the box has 6 GB of swap and the AI
      # work is remote anyway.
      EXTRACTOR_VLM_CONCURRENCY: 1
      EXTRACTOR_VLM_DPI: 300
      # Recycle the worker process regularly so any leak is bounded.
      CELERYD_MAX_TASKS_PER_CHILD: 4
