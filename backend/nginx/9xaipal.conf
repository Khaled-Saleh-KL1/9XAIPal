# nginx site config — public entrypoint for 9XAIPal.
# ---------------------------------------------------------------------------
# Installed on the HOST (not a container — nginx and certbot are managed
# outside this repo). Copy to /etc/nginx/sites-available/9xaipal.conf, symlink
# into sites-enabled, replace YOUR_DOMAIN below, then run
# `certbot --nginx -d YOUR_DOMAIN` — certbot's nginx plugin rewrites this file
# in place to add the HTTPS server block and the 80->443 redirect.
#
#   /api/*, /static/*, /openapi.json, /docs*, /redoc*  -> the API container on
#                                                          127.0.0.1:8000
#   /*                                                  -> the built SPA
#
# Same-origin is a bonus: the SPA calls /api on the host it was served from,
# so there is no CORS preflight and no mixed-content risk.
#
# proxy_buffering off + chunked_transfer_encoding on keep streaming/SSE
# responses (e.g. streamed chat tokens) flushing to the browser immediately
# instead of being buffered by nginx.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Build with:  cd frontend && VITE_API_BASE_URL=https://YOUR_DOMAIN npm run build
    # then copy dist/ here.
    root /path/to/9XAIPal/backend/frontend-dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    client_max_body_size 100m;

    # Everything the API owns must be matched BEFORE the SPA catch-all below,
    # or it silently returns index.html with HTTP 200 — which looks like a
    # success to curl and like a broken image to a browser.
    #
    # /static/* is not optional: the API mounts figure crops, extracted page
    # images and the original PDFs under /static/{images,extracted,assets},
    # and the SPA references them with same-origin relative URLs. Without
    # this, every figure in a paper renders as a broken image.
    location ~ ^/(api|static)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming (SSE / chunked chat tokens) must reach the browser
        # immediately, not sit in an nginx buffer.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
    }

    location ~ ^/(openapi\.json|docs|redoc) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # nginx's bundled mime.types (varies by distro/version) often has no
    # entry for `.mjs` — the frontend bundles pdf.js's worker as one (see
    # PdfViewer.tsx's `pdfjs-dist/build/pdf.worker.min.mjs?url` import) so it
    # can construct a `type: 'module'` Worker same-origin instead of from a
    # CDN. Without an explicit JS Content-Type here, a missing mime.types
    # entry falls back to `default_type` (often application/octet-stream),
    # and a browser refuses to run a module script served with a non-JS
    # MIME type — the worker silently never starts, and the PDF viewer
    # stays blank with no visible error at all.
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # Everything else is the SPA. try_files sends unknown paths to index.html
    # so client-side routes survive a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
