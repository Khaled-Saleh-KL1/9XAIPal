# 9XAIPal — Oracle Cloud "Always Free" ARM VM deployment
# ---------------------------------------------------------------------------
# A self-contained stack for a fresh Oracle VM (4 ARM cores / 24 GB RAM /
# 200 GB disk). It runs the WHOLE backend — API + Celery worker + Postgres +
# Redis + SearXNG — on one box, so the app is "entirely on the web" and does
# NOT depend on your local machine.
#
# Key differences from docker-compose.yml (local dev):
#   • EXTRACTOR_PROVIDER=vlm  → PDF extraction uses a CLOUD VLM (gemma4:31b on
#     Ollama Cloud) instead of the local MinerU/torch pipeline. Both app
#     services build from `Dockerfile.oracle`, which installs
#     requirements.oracle.txt (requirements.txt without `mineru[core]`) — so
#     no torch/OpenCV wheels and no 5 GB model download on the ARM box.
#   • OLLAMA_BASE_URL=https://ollama.com + OLLAMA_API_KEY → chat AND vision
#     both run on Ollama Cloud with gemma4:31b (it is multimodal).
#     NOTE: qwen3-vl:235b was RETIRED by Ollama on 2026-06-16.
#   • EMBEDDINGS DO NOT run on Ollama: this account's key returns
#     "unauthorized" for every embedding model, so EMBEDDING_PROVIDER is
#     pinned to `gemini` (gemini-embedding-001, 1024-dim, matches
#     VECTOR_DIMENSION exactly). Pinning matters — the "auto" chain probes
#     Ollama first, finds ollama.com reachable, and would fail there.
#   • SERVE_FRONTEND=false → the API does NOT serve the SPA. The UI lives on
#     Vercel (9xaipal.vercel.app) and points here via VITE_API_BASE_URL.
#   • No frontend-build / autoheal-docker-socket services (not needed here).
#
# Public traffic enters ONLY through the `caddy` service on 80/443, which
# terminates TLS with a real Let's Encrypt certificate and proxies to api:8000.
# Postgres, Redis and SearXNG are not published to the host at all.
#
# Usage (on the VM, inside the repo's backend/ folder):
#   cp .env.oracle .env   # set OLLAMA_API_KEY, POSTGRES_PASSWORD, CADDY_SITE_ADDRESS
#   docker compose -f docker-compose.oracle.yml up -d --build
#   docker compose -f docker-compose.oracle.yml logs -f api
#
# The Vercel frontend then needs VITE_API_BASE_URL=https://<CADDY_SITE_ADDRESS>
# set in Vercel → Settings → Environment (build-time value → redeploy after).
# ---------------------------------------------------------------------------

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: 9xaipal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-9xaipal}
      POSTGRES_USER: ${POSTGRES_USER:-9xaipal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Internal only — NOT published to the host/internet. The app reaches
    # Postgres by service name (postgres:5432) on the compose network.
    volumes:
       - 9xaipal_postgres_data:/var/lib/postgresql/data
       - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-9xaipal} -d ${POSTGRES_DB:-9xaipal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: 9xaipal-redis
    # Internal only — reached as redis://redis:6379 on the compose network.
    volumes:
       - 9xaipal_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: 9xaipal-searxng
    # Internal only — reached as http://searxng:8080 on the compose network.
    volumes:
       - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      BASE_URL: http://localhost:${SEARXNG_PORT:-8080}/
      INSTANCE_NAME: 9xaipal-searxng
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Celery worker — runs the ingestion pipeline. Builds from Dockerfile.oracle
  # (no MinerU, no torch) because EXTRACTOR_PROVIDER=vlm does all PDF
  # extraction on Ollama Cloud.
  # ------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.oracle
    container_name: 9xaipal-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=1
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-9xaipal}
      POSTGRES_USER: ${POSTGRES_USER:-9xaipal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
       # ── AI: everything runs on Ollama Cloud with your key ──────────────
      OLLAMA_BASE_URL: https://ollama.com
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:?set OLLAMA_API_KEY in .env}
       # Embeddings run on Gemini: this Ollama key has chat+vision only.
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      LLM_PROVIDER: ollama
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-custom}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      CHAT_MODEL: ${CHAT_MODEL:-gemma4:31b}
      VLM_MODEL: ${VLM_MODEL:-gemma4:31b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-minilm}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-1024}
      EMBED_MAX_CHARS: ${EMBED_MAX_CHARS:-3000}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-}
      CHAT_NUM_PREDICT: ${CHAT_NUM_PREDICT:-0}
       # ── Extraction: cloud VLM, no local MinerU ─────────────────────────
      EXTRACTOR_PROVIDER: vlm
      INGEST_PROFILE: ${INGEST_PROFILE:-full}
      EXTRACTOR_VLM_MODEL: ${EXTRACTOR_VLM_MODEL:-gemma4:31b}
      EXTRACTOR_VLM_DPI: ${EXTRACTOR_VLM_DPI:-300}
      EXTRACTOR_VLM_MAX_PAGES: ${EXTRACTOR_VLM_MAX_PAGES:-0}
      EXTRACTOR_VLM_CONCURRENCY: ${EXTRACTOR_VLM_CONCURRENCY:-3}
      ALLOW_PYMUPDF_FALLBACK: ${ALLOW_PYMUPDF_FALLBACK:-true}
       # SearXNG is a compose service on the same network — reach it by name.
      SEARXNG_URL: http://searxng:8080
      STORAGE_ROOT: /data/storage
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-15}
    volumes:
       - ./app/storage:/data/storage
       - ./app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # API — FastAPI backend. Does NOT serve the SPA (SERVE_FRONTEND=false);
  # the UI is on Vercel and calls this via VITE_API_BASE_URL.
  # ------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.oracle
    container_name: 9xaipal-api
    command: >
      uvicorn app.main:app
       --host 0.0.0.0 --port 8000
       --workers 2
       --log-level info
    # Bind to localhost only. Public traffic enters via Caddy (443) → api:8000
    # on the compose network; 127.0.0.1:8000 stays available on the VM for
    # health checks without exposing the API directly to the internet.
    ports:
       - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-9xaipal}
      POSTGRES_USER: ${POSTGRES_USER:-9xaipal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
       # ── AI: Ollama Cloud ───────────────────────────────────────────────
      OLLAMA_BASE_URL: https://ollama.com
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:?set OLLAMA_API_KEY in .env}
       # Embeddings run on Gemini: this Ollama key has chat+vision only.
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      LLM_PROVIDER: ollama
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-custom}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      CHAT_MODEL: ${CHAT_MODEL:-gemma4:31b}
      VLM_MODEL: ${VLM_MODEL:-gemma4:31b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-minilm}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-1024}
      EMBED_MAX_CHARS: ${EMBED_MAX_CHARS:-3000}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-}
      CHAT_NUM_PREDICT: ${CHAT_NUM_PREDICT:-0}
      GUARDRAIL_SKIP_IN_PAPER: ${GUARDRAIL_SKIP_IN_PAPER:-true}
       # ── Extraction: cloud VLM ──────────────────────────────────────────
      EXTRACTOR_PROVIDER: vlm
      INGEST_PROFILE: ${INGEST_PROFILE:-full}
      EXTRACTOR_VLM_MODEL: ${EXTRACTOR_VLM_MODEL:-gemma4:31b}
      EXTRACTOR_VLM_DPI: ${EXTRACTOR_VLM_DPI:-300}
      EXTRACTOR_VLM_MAX_PAGES: ${EXTRACTOR_VLM_MAX_PAGES:-0}
      EXTRACTOR_VLM_CONCURRENCY: ${EXTRACTOR_VLM_CONCURRENCY:-3}
      ALLOW_PYMUPDF_FALLBACK: ${ALLOW_PYMUPDF_FALLBACK:-true}
      SEARXNG_URL: http://searxng:8080
      STORAGE_ROOT: /data/storage

      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-15}
       # UI is on Vercel, not here.
      SERVE_FRONTEND: "false"
      DEBUG: "false"
       # Allow the Vercel frontend (and any preview host) to call this API.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://9xaipal.vercel.app}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
    volumes:
       - ./app/storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Caddy — HTTPS reverse proxy and the ONLY public entrypoint. Fetches a
  # real Let's Encrypt certificate for CADDY_SITE_ADDRESS (a sslip.io host
  # that resolves to this VM's public IP) and proxies 443 → api:8000.
  # Requires ports 80 + 443 open in the Oracle security list (ACME uses 80).
  # ------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: 9xaipal-caddy
    ports:
       - "80:80"
       - "443:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?set CADDY_SITE_ADDRESS in .env (e.g. 152-67-12-34.sslip.io)}
    volumes:
       - ./Caddyfile:/etc/caddy/Caddyfile:ro
       # The built SPA, served at / alongside the API at /api. Present so the
       # app stays reachable on networks that block *.vercel.app by TLS SNI.
       # Populate with:  frontend/  npm run build  ->  scp dist/ to ./frontend-dist
       - ./frontend-dist:/srv/frontend:ro
       - 9xaipal_caddy_data:/data
       - 9xaipal_caddy_config:/config
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  9xaipal_postgres_data:
  9xaipal_redis_data:
  9xaipal_caddy_data:
  9xaipal_caddy_config:
