# Overlay for the OVH self-hosted VM (6 CPU / 11GB RAM / x86_64, no GPU).
#
# Use together with the base file:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.selfhost.yml up -d --build
#
# docker-compose.prod.yml defaults to EXTRACTOR_PROVIDER=vlm (cloud VLM
# extraction) because it was written for Oracle's free-tier 1GB ARM VM, which
# can't afford local MinerU/torch. This box can: 6 CPUs and 11GB RAM is
# plenty for MinerU's CPU-bound extraction (the same path already proven out
# in docker-compose.yml for local dev), and it gives better table/equation/
# figure fidelity than the cloud-VLM path. So this overlay:
#
#   • Builds celery_worker from Dockerfile.mineru instead of Dockerfile.oracle
#     (adds MinerU + torch + the OpenCV/runtime libs it needs).
#   • Passes HF_TOKEN as a build arg so Dockerfile.mineru's
#     `mineru-models-download` step (which runs at BUILD time, before any
#     container exists) doesn't hit anonymous Hugging Face rate limits.
#     Compose `environment:` only reaches a *running* container, never a
#     `docker build` step, hence the separate `args:` wiring here.
#   • Sets EXTRACTOR_PROVIDER=mineru explicitly (the base file hardcodes
#     `vlm`, so it must be overridden here, not just left unset).
#   • Caps the worker's memory so a huge PDF OOMs only that one container
#     (which then auto-restarts via `restart: unless-stopped`) instead of
#     pressuring postgres/redis/searxng/api on the same box. Batches large
#     books into page-range chunks for the same reason.
#
# Chat/vision still run on Ollama Cloud (OLLAMA_API_KEY, gemma4:31b-cloud —
# unchanged from the base file); embeddings still run on this host's own
# Ollama (unchanged). Only PDF extraction moves from cloud to local.

services:
  celery_worker:
    build:
      dockerfile: Dockerfile.mineru
      args:
        HF_TOKEN: ${HF_TOKEN:-}
    environment:
      EXTRACTOR_PROVIDER: mineru
      # Extract large books in page-range batches so peak RAM stays bounded
      # regardless of length (an unbounded extraction can OOM-kill the
      # worker on a 500+ page book). 0 disables batching.
      MINERU_PAGE_BATCH_SIZE: ${MINERU_PAGE_BATCH_SIZE:-100}
    deploy:
      resources:
        limits:
          # Headroom for MinerU extraction. Leaves the rest of the box (api,
          # postgres, redis, searxng, host Ollama for embeddings, OS) enough
          # of the 11GB total. Raise if extraction of large books gets
          # OOM-killed; lower if other services feel starved under load.
          memory: ${WORKER_MEM_LIMIT:-6G}

  api:
    environment:
      # api never extracts PDFs itself (celery_worker does), but keep this
      # in sync so nothing reports a stale/contradictory provider.
      EXTRACTOR_PROVIDER: mineru
