[pytest]
# pytest.ini rather than pyproject.toml: pyproject.toml is listed in
# .gitignore, so config placed there would not reach a fresh clone.

testpaths = tests

# conftest.py declares `async def` fixtures with no explicit marker. Under
# pytest-asyncio's default (strict) mode those are collected but never run,
# which surfaces as an opaque `assert not self._finalizers` AssertionError at
# teardown rather than anything resembling a helpful message.
asyncio_mode = auto

# ⚠ These tests run against a REAL PostgreSQL and conftest.py truncates
# `documents CASCADE` before and after every test. Point POSTGRES_DB at a
# throwaway database before running, or the library is destroyed:
#
#     POSTGRES_DB=scholarflow_test pytest -v
#
# See docs/roadmap.md — removing this footgun is tracked there.

filterwarnings =
    ignore::DeprecationWarning:importlib._bootstrap
