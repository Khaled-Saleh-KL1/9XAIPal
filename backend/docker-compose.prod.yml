# 9XAIPal — production VM deployment
# ---------------------------------------------------------------------------
# A self-contained stack for the production server. It runs the WHOLE
# backend — API + Celery worker + Postgres + Redis — on one box, so the app
# is "entirely on the web" and does NOT depend on your local machine.
#   • No SearXNG — web search goes through Ollama Cloud's own web-search
#     capability instead of a self-hosted search engine. Every SearXNG call
#     in app code (app/search/searxng_client.py) already catches all
#     exceptions and degrades to an empty result list, and the /health
#     endpoint's overall status only depends on the database — so simply not
#     running this service is a safe, code-change-free way to disable it.
#
# Key differences from docker-compose.yml (local dev):
#   • EXTRACTOR_PROVIDER=vlm  → PDF extraction uses a CLOUD VLM (gemma4:31b on
#     Ollama Cloud) instead of the local MinerU/torch pipeline. Both app
#     services build from `Dockerfile.oracle`, which installs
#     requirements.oracle.txt (requirements.txt without `mineru[core]`) — so
#     no torch/OpenCV wheels and no multi-GB model download on the box.
#   • OLLAMA_BASE_URL=https://ollama.com + OLLAMA_API_KEY → chat AND vision
#     both run on Ollama Cloud with gemma4:31b (it is multimodal).
#     NOTE: qwen3-vl:235b was RETIRED by Ollama on 2026-06-16.
#   • EMBEDDINGS run on Ollama installed directly on this host (not Ollama
#     Cloud — that key has no embedding access). EMBEDDING_PROVIDER is pinned
#     to `custom` against http://host.docker.internal:11434/v1 with
#     qwen3-embedding:0.6b (1024-dim, matches VECTOR_DIMENSION exactly).
#     Pinning matters — the "auto" chain probes Ollama first, finds
#     ollama.com reachable, and would fail there.
#   • SERVE_FRONTEND=false → the API does NOT serve the SPA. The host's own
#     nginx install (not managed by this compose file) serves the built SPA
#     and reverse-proxies /api to this stack — see backend/nginx/9xaipal.conf.
#   • No frontend-build service (not needed here — the host builds the SPA
#     separately). The `autoheal` watchdog IS included: `restart:
#     unless-stopped` alone only recovers a container that has actually
#     exited (crash/OOM); it does nothing for one that is still running but
#     hung. autoheal restarts any container labeled autoheal=true the moment
#     its healthcheck reports "unhealthy", covering that second failure mode.
#
# Public traffic enters through the host's nginx (installed separately, not a
# container here) on 80/443, which serves the built SPA and reverse-proxies
# to api:8000 published on 127.0.0.1. Postgres and Redis are not published to
# the host at all.
#
# Usage (on the VM, inside the repo's backend/ folder):
#   cp .env.prod .env   # set OLLAMA_API_KEY, POSTGRES_PASSWORD
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f api
#
# Then point nginx (see backend/nginx/9xaipal.conf) at this box and build the
# frontend with VITE_API_BASE_URL=https://<your-domain>.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: 9xaipal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-9xaipal}
      POSTGRES_USER: ${POSTGRES_USER:-9xaipal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Internal only — NOT published to the host/internet. The app reaches
    # Postgres by service name (postgres:5432) on the compose network.
    volumes:
       - 9xaipal_postgres_data:/var/lib/postgresql/data
       - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-9xaipal} -d ${POSTGRES_DB:-9xaipal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      autoheal: "true"

  redis:
    image: redis:7-alpine
    container_name: 9xaipal-redis
    # Internal only — reached as redis://redis:6379 on the compose network.
    volumes:
       - 9xaipal_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    labels:
      autoheal: "true"

  # ------------------------------------------------------------------
  # Celery worker — runs the ingestion pipeline. Builds from Dockerfile.oracle
  # (no MinerU, no torch) because EXTRACTOR_PROVIDER=vlm does all PDF
  # extraction on Ollama Cloud.
  # ------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.oracle
    container_name: 9xaipal-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=1
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-9xaipal}
      POSTGRES_USER: ${POSTGRES_USER:-9xaipal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
       # ── AI: chat/vision on Ollama Cloud, embeddings on this host's Ollama ──
      OLLAMA_BASE_URL: https://ollama.com
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:?set OLLAMA_API_KEY in .env}
      LLM_PROVIDER: ollama
       # Embeddings: this Ollama Cloud key has chat+vision only, so pin
       # embeddings to the Ollama installed directly on this host.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-custom}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      CHAT_MODEL: ${CHAT_MODEL:-gemma4:31b}
      VLM_MODEL: ${VLM_MODEL:-gemma4:31b}
      GENERATE_FIGURE_DESCRIPTIONS: ${GENERATE_FIGURE_DESCRIPTIONS:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      EMBEDDING_MAX_CONCURRENCY: ${EMBEDDING_MAX_CONCURRENCY:-2}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-1024}
      EMBED_MAX_CHARS: ${EMBED_MAX_CHARS:-3000}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-}
      CHAT_NUM_PREDICT: ${CHAT_NUM_PREDICT:-0}
       # ── Extraction: cloud VLM, no local MinerU ─────────────────────────
      EXTRACTOR_PROVIDER: vlm
      INGEST_PROFILE: ${INGEST_PROFILE:-full}
      EXTRACTOR_VLM_MODEL: ${EXTRACTOR_VLM_MODEL:-gemma4:31b}
      EXTRACTOR_VLM_DPI: ${EXTRACTOR_VLM_DPI:-300}
      EXTRACTOR_VLM_MAX_PAGES: ${EXTRACTOR_VLM_MAX_PAGES:-0}
      EXTRACTOR_VLM_CONCURRENCY: ${EXTRACTOR_VLM_CONCURRENCY:-3}
      ALLOW_PYMUPDF_FALLBACK: ${ALLOW_PYMUPDF_FALLBACK:-true}
       # Web search: Tavily when TAVILY_API_KEY is set (auto), else disabled
       # now that SearXNG is gone from this deployment. Query strings reach
       # Tavily's servers when this is active — see config.py's note.
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-auto}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      STORAGE_ROOT: /data/storage
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-15}
    volumes:
       - ./app/storage:/data/storage
       - ./app:/app/app:ro
    extra_hosts:
       # Ollama runs on the host, not in this compose network.
       - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # API — FastAPI backend. Does NOT serve the SPA (SERVE_FRONTEND=false);
  # the host's nginx serves the built SPA and reverse-proxies /api here.
  # ------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.oracle
    container_name: 9xaipal-api
    command: >
      uvicorn app.main:app
       --host 0.0.0.0 --port 8000
       --workers 2
       --log-level info
    # Bind to localhost only. Public traffic enters via the host's nginx
    # (443) → 127.0.0.1:8000; the API is never exposed directly to the
    # internet, only reachable on the VM itself for health checks.
    ports:
       - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-9xaipal}
      POSTGRES_USER: ${POSTGRES_USER:-9xaipal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
       # ── AI: chat/vision on Ollama Cloud, embeddings on this host's Ollama ──
      OLLAMA_BASE_URL: https://ollama.com
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:?set OLLAMA_API_KEY in .env}
      LLM_PROVIDER: ollama
       # Embeddings: this Ollama Cloud key has chat+vision only, so pin
       # embeddings to the Ollama installed directly on this host.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-custom}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      CHAT_MODEL: ${CHAT_MODEL:-gemma4:31b}
      VLM_MODEL: ${VLM_MODEL:-gemma4:31b}
      GENERATE_FIGURE_DESCRIPTIONS: ${GENERATE_FIGURE_DESCRIPTIONS:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      EMBEDDING_MAX_CONCURRENCY: ${EMBEDDING_MAX_CONCURRENCY:-2}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-1024}
      EMBED_MAX_CHARS: ${EMBED_MAX_CHARS:-3000}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-}
      CHAT_NUM_PREDICT: ${CHAT_NUM_PREDICT:-0}
      GUARDRAIL_SKIP_IN_PAPER: ${GUARDRAIL_SKIP_IN_PAPER:-true}
       # ── Extraction: cloud VLM ──────────────────────────────────────────
      EXTRACTOR_PROVIDER: vlm
      INGEST_PROFILE: ${INGEST_PROFILE:-full}
      EXTRACTOR_VLM_MODEL: ${EXTRACTOR_VLM_MODEL:-gemma4:31b}
      EXTRACTOR_VLM_DPI: ${EXTRACTOR_VLM_DPI:-300}
      EXTRACTOR_VLM_MAX_PAGES: ${EXTRACTOR_VLM_MAX_PAGES:-0}
      EXTRACTOR_VLM_CONCURRENCY: ${EXTRACTOR_VLM_CONCURRENCY:-3}
      ALLOW_PYMUPDF_FALLBACK: ${ALLOW_PYMUPDF_FALLBACK:-true}
       # Web search: Tavily when TAVILY_API_KEY is set (auto), else disabled
       # now that SearXNG is gone from this deployment. Query strings reach
       # Tavily's servers when this is active — see config.py's note.
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-auto}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      STORAGE_ROOT: /data/storage
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-15}
       # nginx on the host serves the SPA and proxies /api same-origin, so
       # CORS is normally a non-issue in production. Leave empty unless you
       # point a second, separately-hosted frontend at this API.
      SERVE_FRONTEND: "false"
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      # Auth. Only the api service needs this — celery_worker never handles
      # signup/login, and by the time a task runs, user_id is already durably
      # stored on the documents row from upload time.
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:-}
    volumes:
       - ./app/storage:/data/storage
    extra_hosts:
       # Ollama runs on the host, not in this compose network.
       - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    labels:
      autoheal: "true"

  # Watchdog: restarts any container labeled autoheal=true whose healthcheck
  # turns "unhealthy". `restart: unless-stopped` only fires when a process
  # EXITS (crash/OOM); this covers the other failure mode — a container that
  # is still running but hung/not responding. Needs the Docker socket to
  # issue the restarts.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: 9xaipal-autoheal
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 15
      AUTOHEAL_START_PERIOD: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  9xaipal_postgres_data:
  9xaipal_redis_data:
