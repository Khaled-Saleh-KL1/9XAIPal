# 9XAIPal — production deployment (6 CPU / 11GB RAM / x86_64, no GPU)
# ---------------------------------------------------------------------------
# The one and only deployment target — a self-contained stack running the
# WHOLE backend (API + Celery worker + Postgres + Redis) on one box, so the
# app is "entirely on the web" and does NOT depend on your local machine.
#   • Web search: a 5-provider cascade (tavily, linkup, exa,
#     serpapi, duckduckgo — see app/search/web.py), no self-hosted search
#     engine on this box. Every provider client catches its own exceptions
#     and degrades to an empty result list, and the /health endpoint's
#     overall status only depends on the database — a provider with no key
#     configured is simply skipped (except duckduckgo, which needs none).
#
# Key differences from docker-compose.yml (local dev):
#   • celery_worker builds from Dockerfile.mineru (adds MinerU + torch + the
#     OpenCV/runtime libs it needs) — same as local dev, real local
#     extraction with full table/equation/figure fidelity, not a cloud VLM.
#     `HF_TOKEN` reaches its model-download step (which runs at *build*
#     time, avoiding anonymous Hugging Face rate limits on the ~5GB weight
#     download) via a BuildKit build-time SECRET, not a build arg — an arg
#     or a plain environment variable both end up permanently readable in
#     `docker history`; a secret exists only for that one RUN step.
#   • api builds from the lighter Dockerfile.lite instead — it never runs
#     MinerU itself (celery_worker does all extraction), so there is no
#     reason for its image to carry torch/OpenCV too.
#   • MINERU_PAGE_BATCH_SIZE extracts large documents in page-range batches:
#     bounds peak RAM (an unbatched extraction of a huge book can OOM-kill
#     the worker) and doubles as the granularity of the real
#     extraction-progress reporting the UI shows.
#   • WORKER_MEM_LIMIT caps celery_worker's own memory so a huge PDF OOMs
#     only that one container (which then auto-restarts, see the
#     `restart: unless-stopped` + `autoheal` note below) instead of
#     pressuring postgres/redis/api on the same box.
#   • OLLAMA_BASE_URL=https://ollama.com + OLLAMA_API_KEY → chat AND vision
#     both run on Ollama Cloud with gemma4:31b (it is multimodal).
#     NOTE: qwen3-vl:235b was RETIRED by Ollama on 2026-06-16.
#   • EMBEDDINGS run on Ollama installed directly on this host (not Ollama
#     Cloud — that key has no embedding access). EMBEDDING_PROVIDER is pinned
#     to `custom` against http://host.docker.internal:11434/v1 with
#     qwen3-embedding:0.6b (1024-dim, matches VECTOR_DIMENSION exactly).
#     Pinning matters — the "auto" chain probes Ollama first, finds
#     ollama.com reachable, and would fail there.
#   • SERVE_FRONTEND=false → the API does NOT serve the SPA. The host's own
#     nginx install (not managed by this compose file) serves the built SPA
#     and reverse-proxies /api to this stack — see backend/nginx/9xaipal.conf.
#   • No frontend-build service (not needed here — the host builds the SPA
#     separately). The `autoheal` watchdog IS included: `restart:
#     unless-stopped` alone only recovers a container that has actually
#     exited (crash/OOM); it does nothing for one that is still running but
#     hung. autoheal restarts any container labeled autoheal=true the moment
#     its healthcheck reports "unhealthy", covering that second failure mode.
#
# Public traffic enters through the host's nginx (installed separately, not a
# container here) on 80/443, which serves the built SPA and reverse-proxies
# to api:8000 published on 127.0.0.1. Postgres and Redis are not published to
# the host at all.
#
# Usage (on the VM, inside the repo's backend/ folder):
#   cp .env.prod .env   # set OLLAMA_API_KEY, POSTGRES_PASSWORD
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f api
#
# Then point nginx (see backend/nginx/9xaipal.conf) at this box and build the
# frontend with VITE_API_BASE_URL=https://<your-domain>.
# ---------------------------------------------------------------------------

# No service here set a logging driver, so every container used Docker's
# daemon default — which, with no /etc/docker/daemon.json on this box, is
# json-file with NO size cap at all. A long-lived, unattended box with no one
# rotating logs by hand eventually fills the disk from log growth alone,
# which is exactly the kind of slow, silent failure this file exists to rule
# out. 50MB per container (10MB x 5 files) is plenty of history for
# debugging without being unbounded.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: 9xaipal-postgres
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-9xaipal}
      POSTGRES_USER: ${POSTGRES_USER:-9xaipal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Internal only — NOT published to the host/internet. The app reaches
    # Postgres by service name (postgres:5432) on the compose network.
    volumes:
       - 9xaipal_postgres_data:/var/lib/postgresql/data
       - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-9xaipal} -d ${POSTGRES_DB:-9xaipal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      autoheal: "true"

  redis:
    image: redis:7-alpine
    container_name: 9xaipal-redis
    logging: *default-logging
    # Internal only — reached as redis://redis:6379 on the compose network.
    volumes:
       - 9xaipal_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    labels:
      autoheal: "true"

  # ------------------------------------------------------------------
  # Celery worker — runs the ingestion pipeline. Builds from Dockerfile.mineru
  # for real local extraction (full table/equation/figure fidelity), same as
  # local dev.
  # ------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.mineru
      # A build-time SECRET, not a build arg — see Dockerfile.mineru's own
      # comment on why. `secrets:` below sources it from HF_TOKEN in
      # backend/.env; empty/unset is fine (anonymous HF download, just more
      # likely to hit rate limits).
      secrets:
        - hf_token
    container_name: 9xaipal-celery-worker
    logging: *default-logging
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=1
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-9xaipal}
      POSTGRES_USER: ${POSTGRES_USER:-9xaipal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
       # ── AI: chat/vision on Ollama Cloud, embeddings on this host's Ollama ──
      OLLAMA_BASE_URL: https://ollama.com
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:?set OLLAMA_API_KEY in .env}
       # "auto", not a pin: a pin means exactly one backend with NO
       # fallback (see app/llm/resolver.py), which would defeat the chat
       # cascade the moment a second provider key is added here. "auto"
       # still puts Ollama first — it's the only one configured today —
       # but now a real Ollama failure falls through instead of 503ing.
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
       # Embeddings: this Ollama Cloud key has chat+vision only, so pin
       # embeddings to the Ollama installed directly on this host.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-custom}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      CHAT_MODEL: ${CHAT_MODEL:-gemma4:31b}
      VLM_MODEL: ${VLM_MODEL:-gemma4:31b}
      GENERATE_FIGURE_DESCRIPTIONS: ${GENERATE_FIGURE_DESCRIPTIONS:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      EMBEDDING_MAX_CONCURRENCY: ${EMBEDDING_MAX_CONCURRENCY:-2}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-1024}
      EMBED_MAX_CHARS: ${EMBED_MAX_CHARS:-3000}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-}
      CHAT_NUM_PREDICT: ${CHAT_NUM_PREDICT:-0}
       # ── Extraction: local MinerU (this box has the CPU/RAM for it) ─────
      EXTRACTOR_PROVIDER: mineru
      INGEST_PROFILE: ${INGEST_PROFILE:-full}
      ALLOW_PYMUPDF_FALLBACK: ${ALLOW_PYMUPDF_FALLBACK:-true}
       # Extract large documents in page-range batches so peak RAM stays
       # bounded regardless of length. 0 disables batching.
      MINERU_PAGE_BATCH_SIZE: ${MINERU_PAGE_BATCH_SIZE:-100}
       # Web search cascade: tavily -> linkup -> exa -> serpapi ->
       # duckduckgo, first configured one that answers wins (see
       # app/search/web.py). Query strings reach whichever provider actually
       # serves the call — see config.py's note. duckduckgo needs no key
       # and is always eligible, so this box always has web search even if
       # every paid key above is empty.
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-auto}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LINKUP_API_KEY: ${LINKUP_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      STORAGE_ROOT: /data/storage
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-15}
    volumes:
       - ./app/storage:/data/storage
       - ./app:/app/app:ro
    extra_hosts:
       # Ollama runs on the host, not in this compose network.
       - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # `celery inspect ping` round-trips through the broker (Redis), not just
    # a process-alive check — it answers even under a busy --concurrency=1
    # extraction as long as the worker's control-plane thread is genuinely
    # responsive, and only THAT is what autoheal restarts on. `restart:
    # unless-stopped` alone only catches an exited process; a hung-but-still-
    # running worker (deadlock, a stuck connection) would otherwise sit
    # silently dead-in-place forever with nothing watching it.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping --timeout 5 | grep -q OK"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      autoheal: "true"
    # Headroom for MinerU extraction on a book-length PDF while leaving
    # enough of the box's 11GB total for postgres/redis/api/autoheal/OS/host
    # Ollama, plus whatever else shares the box (a portfolio site, another
    # small app). There is no swap on this box, so a real overrun hits this
    # limit hard, by design: it OOM-kills only this one container, which then
    # auto-restarts (see the healthcheck note above), instead of the box
    # coming under memory pressure everywhere at once. Raise if extraction of
    # large books gets OOM-killed under real multi-user load; lower if other
    # services feel starved.
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEM_LIMIT:-6G}

  # ------------------------------------------------------------------
  # API — FastAPI backend. Does NOT serve the SPA (SERVE_FRONTEND=false);
  # the host's nginx serves the built SPA and reverse-proxies /api here.
  # ------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.lite
    container_name: 9xaipal-api
    logging: *default-logging
    command: >
      uvicorn app.main:app
       --host 0.0.0.0 --port 8000
       --workers 2
       --log-level info
    # Bind to localhost only. Public traffic enters via the host's nginx
    # (443) → 127.0.0.1:8000; the API is never exposed directly to the
    # internet, only reachable on the VM itself for health checks.
    ports:
       - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-9xaipal}
      POSTGRES_USER: ${POSTGRES_USER:-9xaipal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
       # ── AI: chat/vision on Ollama Cloud, embeddings on this host's Ollama ──
      OLLAMA_BASE_URL: https://ollama.com
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:?set OLLAMA_API_KEY in .env}
       # "auto", not a pin: a pin means exactly one backend with NO
       # fallback (see app/llm/resolver.py), which would defeat the chat
       # cascade the moment a second provider key is added here. "auto"
       # still puts Ollama first — it's the only one configured today —
       # but now a real Ollama failure falls through instead of 503ing.
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
       # Embeddings: this Ollama Cloud key has chat+vision only, so pin
       # embeddings to the Ollama installed directly on this host.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-custom}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      CHAT_MODEL: ${CHAT_MODEL:-gemma4:31b}
      VLM_MODEL: ${VLM_MODEL:-gemma4:31b}
      GENERATE_FIGURE_DESCRIPTIONS: ${GENERATE_FIGURE_DESCRIPTIONS:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      EMBEDDING_MAX_CONCURRENCY: ${EMBEDDING_MAX_CONCURRENCY:-2}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-1024}
      EMBED_MAX_CHARS: ${EMBED_MAX_CHARS:-3000}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-}
      CHAT_NUM_PREDICT: ${CHAT_NUM_PREDICT:-0}
      GUARDRAIL_SKIP_IN_PAPER: ${GUARDRAIL_SKIP_IN_PAPER:-true}
       # api never extracts PDFs itself (celery_worker does); kept in sync
       # so nothing reports a stale/contradictory provider.
      EXTRACTOR_PROVIDER: mineru
      INGEST_PROFILE: ${INGEST_PROFILE:-full}
      ALLOW_PYMUPDF_FALLBACK: ${ALLOW_PYMUPDF_FALLBACK:-true}
       # Web search cascade: tavily -> linkup -> exa -> serpapi ->
       # duckduckgo, first configured one that answers wins (see
       # app/search/web.py). Query strings reach whichever provider actually
       # serves the call — see config.py's note. duckduckgo needs no key
       # and is always eligible, so this box always has web search even if
       # every paid key above is empty.
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-auto}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LINKUP_API_KEY: ${LINKUP_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      STORAGE_ROOT: /data/storage
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-15}
       # nginx on the host serves the SPA and proxies /api same-origin, so
       # CORS is normally a non-issue in production. Leave empty unless you
       # point a second, separately-hosted frontend at this API.
      SERVE_FRONTEND: "false"
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      # Auth. Only the api service needs this — celery_worker never handles
      # signup/login, and by the time a task runs, user_id is already durably
      # stored on the documents row from upload time.
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:-}
    volumes:
       - ./app/storage:/data/storage
    extra_hosts:
       # Ollama runs on the host, not in this compose network.
       - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    labels:
      autoheal: "true"

  # Watchdog: restarts any container labeled autoheal=true whose healthcheck
  # turns "unhealthy". `restart: unless-stopped` only fires when a process
  # EXITS (crash/OOM); this covers the other failure mode — a container that
  # is still running but hung/not responding. Needs the Docker socket to
  # issue the restarts.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: 9xaipal-autoheal
    logging: *default-logging
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 15
      AUTOHEAL_START_PERIOD: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  9xaipal_postgres_data:
  9xaipal_redis_data:

# Build-time secrets — reach a RUN step's /run/secrets/<id> only for the
# duration of that step, never an image layer. See celery_worker's build
# block above and Dockerfile.mineru's own comment.
secrets:
  hf_token:
    environment: HF_TOKEN
